<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
background:white;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
max-width:520px;
width:100%;
padding:30px;
text-align:center;
}

h1{
margin-bottom:15px;
font-size:28px;
background:linear-gradient(45deg,#667eea,#764ba2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#map{
height:260px;
border-radius:15px;
margin:20px 0;
}

button{
background:linear-gradient(45deg,#667eea,#764ba2);
border:none;
padding:14px;
color:white;
border-radius:40px;
font-size:16px;
font-weight:600;
width:100%;
cursor:pointer;
margin-top:10px;
}

button:hover{
transform:translateY(-2px);
}

.status{
font-size:15px;
color:#555;
}

.result{
margin-top:15px;
padding:15px;
background:#f6f7ff;
border-radius:12px;
text-align:left;
}

.coords{
font-size:22px;
font-weight:bold;
margin-bottom:6px;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:20px;
font-size:12px;
color:white;
}

.excellent{background:#10b981}
.good{background:#f59e0b}
.fair{background:#ef4444}

.method{
font-size:13px;
color:#666;
margin-top:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>📍 Service Finder</h1>

<div id="status" class="status">
Press the button to detect your location
</div>

<div id="map"></div>

<button onclick="locate()">Find Nearby Services</button>

<div id="results"></div>

</div>

<script>

let map = L.map('map').setView([28.6139,77.2090],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{attribution:'© OpenStreetMap'}
).addTo(map);

let marker=null;
let circle=null;

const statusDiv=document.getElementById("status");
const resultsDiv=document.getElementById("results");


async function locate(){

statusDiv.innerHTML="Detecting location...";

const sources=await Promise.allSettled([
getGPS(),
getIPLocation()
]);

const locations=sources
.map(x=>x.value)
.filter(x=>x && x.lat);

if(locations.length===0){

statusDiv.innerHTML="Location unavailable";

return;

}

const finalLocation=fuseLocations(locations);

renderResult(finalLocation);

updateMap(finalLocation);

}



function getGPS(){

return new Promise(resolve=>{

navigator.geolocation.getCurrentPosition(

pos=>{

resolve({

lat:pos.coords.latitude,

lon:pos.coords.longitude,

accuracy:pos.coords.accuracy,

method:"GPS",

confidence:0.95

})

},

()=>resolve(null),

{

enableHighAccuracy:true,

timeout:8000,

maximumAge:20000

}

)

})

}



async function getIPLocation(){

const providers=[

"https://ipapi.co/json/",
"https://ipinfo.io/json",
"https://ipwho.is/"

];

for(const url of providers){

try{

const r=await fetch(url);

const d=await r.json();

if(d.latitude && d.longitude){

return{

lat:parseFloat(d.latitude),

lon:parseFloat(d.longitude),

accuracy:2000,

method:"IP Geolocation",

confidence:0.5

}

}

if(d.loc){

const [lat,lon]=d.loc.split(",");

return{

lat:parseFloat(lat),

lon:parseFloat(lon),

accuracy:2000,

method:"IP Geolocation",

confidence:0.5

}

}

}catch(e){}

}

return null;

}



function fuseLocations(list){

let lat=0;
let lon=0;
let weightSum=0;
let bestAcc=Infinity;

for(const loc of list){

const weight=(loc.confidence||0.5)/(loc.accuracy||1000);

lat+=loc.lat*weight;
lon+=loc.lon*weight;

weightSum+=weight;

bestAcc=Math.min(bestAcc,loc.accuracy);

}

return{

lat:lat/weightSum,

lon:lon/weightSum,

accuracy:bestAcc,

sources:list.length,

method:list.map(x=>x.method).join(" + ")

}

}



function renderResult(loc){

let quality="fair";

if(loc.accuracy<30)quality="excellent";
else if(loc.accuracy<100)quality="good";

statusDiv.innerHTML="Location detected";

resultsDiv.innerHTML=`

<div class="result">

<div class="coords">

${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)}

</div>

<span class="badge ${quality}">

±${loc.accuracy.toFixed(0)} m

</span>

<div class="method">

Source: ${loc.method}

</div>

</div>

`;

}



function updateMap(loc){

map.setView([loc.lat,loc.lon],16);

if(marker)map.removeLayer(marker);
if(circle)map.removeLayer(circle);

marker=L.marker([loc.lat,loc.lon]).addTo(map);

circle=L.circle([loc.lat,loc.lon],{

radius:loc.accuracy,

color:"#10b981",

fillOpacity:0.2

}).addTo(map);

}

</script>

</body>
</html>
